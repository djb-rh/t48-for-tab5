; tab5-burner — M5Stack Tab5 as a stand-alone front end for an XGecu T48
; ROM programmer on its USB-A port.
;
; Same toolchain as any Tab5 project: the P4 is only supported by the
; pioarduino fork of platform-espressif32, and the m5stack-tab5-p4 board
; definition installs M5Unified itself (so it is not in lib_deps).

[platformio]
default_envs = spike

[common_tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
lib_deps = https://github.com/M5Stack/M5GFX.git
; No upload_port: the Tab5 enumerates as usbmodem101 or usbmodem1101
; depending on the Mac port, and auto-detect handles both.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Phase 0: can the Tab5's USB-A port run a T48 at all? Powers the port,
; enumerates the programmer, asks it for its system info, logs current draw.
[env:spike]
extends = common_tab5
build_src_filter = +<spike/>

; Phase 1: minipro itself on the Tab5, driven over serial (tools/mp.py).
; minipro's sources are compiled unchanged except main.c (renamed main, see
; src/chiptest/minipro_main.c) and usb_nix.c/usb_win.c (replaced by
; src/chiptest/usb_esp.cpp). include/ holds the version.h and zlib.h stand-ins.
[env:chiptest]
extends = common_tab5
board_build.partitions = partitions_chiptest.csv
board_build.filesystem = littlefs
build_flags = -DSHARE_INSTDIR=\"/fs\" -Wno-error -Wno-unused-variable -Wno-unused-function
build_src_filter = +<chiptest/>
                  +<../third_party/minipro/src/*.c>
                  -<../third_party/minipro/src/main.c>
                  -<../third_party/minipro/src/usb_nix.c>
                  -<../third_party/minipro/src/usb_win.c>
